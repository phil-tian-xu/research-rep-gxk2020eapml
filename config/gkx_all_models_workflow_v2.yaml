# Five-year workflow; Huber specifications temporarily disabled after nonconvergence.
# Huber delta and small tuning grids are development choices, not author settings.
GENERAL:
  NAME: "gkx_all_models_workflow_v2"
  TASK_TYPE: "run"

DATA:
  DATASET: "gkx_dev_p05_seed2020"

RUN:
  SPLIT:
    FIRST_TRAIN_YEAR: 1957
    FIRST_TEST_YEAR: 1987
    LAST_TEST_YEAR: 1991
    VALIDATION_YEARS: 12

  MODELS:
    ENABLED: ["OLS", "PCR", "PLS"]
    FIT_INTERCEPT: true
    STANDARDIZE: false
    LINEAR_SOLVER:
      MAX_ITER: 50000
      TOL: 1.0e-8
      INITIAL_STEP: 1.0
    OLS_HUBER:
      HUBER_DELTA: 0.1
    ENET_HUBER:
      HUBER_DELTA: 0.1
      RHO: 0.5
      PENALTY_GRID: [0.001, 0.01]
    PCR:
      COMPONENT_GRID: [1, 2, 3]
    PLS:
      COMPONENT_GRID: [1, 2, 3]
      TOL: 1.0e-12

  EVALUATION:
    VALIDATION:
      NAME: "mse"
      DELTA: null
    TEST:
      NAME: "mse"
      DELTA: null

  OUTPUT_DIR: "results/gkx_all_models_workflow_v2"
