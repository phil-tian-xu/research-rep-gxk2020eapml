# GKX Section 1.7 / Appendix B.3 and A.5. Full specification and choices:
# docs/working_notes/Neural Networks.md
GENERAL:
  NAME: "gkx_nn1_v1"
  TASK_TYPE: "run"
DATA:
  DATASET: "gkx_dev_p05_seed2020_parquet"
  FORMAT: "parquet"
  BATCH_SIZE: 10000
RUN:
  FITTING: "dense"
  MODELS:
    ENABLED: ["NN1"]
    FIT_INTERCEPT: true
    STANDARDIZE: false
    NN:
      LEARNING_RATE_GRID: [0.001, 0.01]
      # Explicit discretization of the reported range; empirical grid unavailable.
      L1_GRID: [0.00001, 0.0001, 0.001]
      BATCH_SIZE: 10000
      MAX_EPOCHS: 100
      PATIENCE: 5
      ENSEMBLE_SIZE: 10
      SEED: 2020
      DEVICE: "cuda"
      PREDICT_BATCH_SIZE: 10000
  REPORT_TABLE1_FIGURE3: true
  OUTPUT_DIR: "results/gkx_nn1_v1"
