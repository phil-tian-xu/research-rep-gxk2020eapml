[project]
name = "research-rep-gxk2020eapml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.7,<2",
    "matplotlib>=3.9,<4",
    "PyYAML>=6,<7",
    "iopath>=0.1.10,<0.2",
    "pandas>=2.2,<2.3",
    "pyarrow>=19,<26",
    "sqlalchemy>=2,<2.1",
    "wrds>=3.5.0",
]

[project.optional-dependencies]
nn = ["torch==2.13.0"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", extra = "nn", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
